# TEMPLATE ONLY – do not fill in real values here, this file is committed to git.
# Create the actual secret on the cluster with the commands in the CI/CD setup guide.
apiVersion: v1
kind: Secret
metadata:
  name: edurando-backend-secret
  namespace: edurando
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://postgres-rw.postgres.svc.cluster.local:5432/edurando?currentSchema=public
  DB_USER: app
  DB_PASSWORD: your_db_password
  RESEND_API_KEY: your_resend_api_key
  APP_BASE_URL: https://edurando.yourdomain.com
  FRONTEND_URL: https://edurando.yourdomain.com
  FRONTEND_ALLOWED_ORIGINS: https://edurando.yourdomain.com
  JWT_SECRET: your_jwt_secret_min_32_chars
  JWT_EXPIRATION: "86400000"
  SERVER_PORT: "9001"
