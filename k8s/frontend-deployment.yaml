apiVersion: apps/v1
kind: Deployment
metadata:
  name: edurando-frontend
  namespace: edurando
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edurando-frontend
  template:
    metadata:
      labels:
        app: edurando-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/krishkalra03/edurando-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
