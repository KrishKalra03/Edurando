server.port=${SERVER_PORT:9001}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Edurando?currentSchema=public}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

resend.api-key=${RESEND_API_KEY}

app.base-url=${APP_BASE_URL:http://localhost:9001}
frontend.url=${FRONTEND_URL:http://localhost:5174}
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB